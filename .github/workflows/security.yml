name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit, not just HEAD.
          fetch-depth: 0

      # Secret scanning
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck (fail only on fixable vulns)
        run: |
          set -uo pipefail

          # Machine-readable output for gating.
          govulncheck -format json ./... > govulncheck.json || true

          # Human-readable report in the job log.
          echo "----- govulncheck report -----"
          govulncheck ./... || true
          echo "------------------------------"

          # Fail only on findings that are BOTH:
          #   1. fixable   — carry a non-empty fixed_version, and
          #   2. called    — the trace reaches an actual symbol (a frame with a
          #                  function), matching govulncheck's own "called" rule.
          # Fixable advisories in transitive modules we require but never call are
          # reported in the human log above and treated as warnings only.
          fixable=$(jq -s '[.[]
            | select(.finding)
            | .finding
            | select((.fixed_version // "") != "")
            | select(any(.trace[]?; .function != null))
          ] | length' govulncheck.json)

          if [ "$fixable" -gt 0 ]; then
            echo "::error::$fixable called vulnerability finding(s) have an available fix — upgrade the affected module."
            exit 1
          fi

          echo "No fixable, called vulnerabilities. Remaining advisories are unfixable or in uncalled dependencies — treated as warnings."

      # SBOM — inventory of everything in the build
      - uses: anchore/sbom-action@v0
        with:
          path: .

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
